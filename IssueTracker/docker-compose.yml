# =========================================================
# DOCKER COMPOSE
# =========================================================
# Services:
# 1. sqlserver -> Local SQL Server database
# 2. api       -> ASP.NET Core Web API
# 3. migration -> EF Core database migrations
# =========================================================

services:

  # =======================================================
  # SQL SERVER SERVICE
  # =======================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: issue-tracker-sqlserver

    environment:
      # Accept Microsoft's SQL Server license agreement.
      ACCEPT_EULA: "Y"

      # Loaded from the .env file.
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"

    # HOST:CONTAINER
    # Local SQL Server: localhost,1435
    ports:
      - "1435:1433"

    # Persistent database storage.
    volumes:
      - sqlserver_data:/var/opt/mssql


  # =======================================================
  # ASP.NET CORE API SERVICE
  # =======================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: issue-tracker-api

    environment:
      # ASP.NET Core listens on port 8080 inside the container.
      ASPNETCORE_HTTP_PORTS: "8080"

      # Connect to the SQL Server service within Docker Compose.
      # This API uses the local database.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IssueTrackerDb_Local;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"

    # HOST:CONTAINER
    # API URL: http://localhost:8081
    ports:
      - "8081:8080"

    # Start SQL Server before the API.
    depends_on:
      - sqlserver


  # =======================================================
  # EF CORE MIGRATION SERVICE
  # =======================================================
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration

    environment:
      # Apply migrations to the local database only.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IssueTrackerDb_Local;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"

    # Start SQL Server before running migrations.
    depends_on:
      - sqlserver


# =========================================================
# DOCKER VOLUMES
# =========================================================
volumes:
  sqlserver_data:

name: issuetracker-prod

services:
  # SQL SERVER SERVICE
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: issue-tracker-sqlserver-prod

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"

    ports:
      - "1434:1433"

    volumes:
      - sqlserver_data_prod:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MIGRATION SERVICE
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration

    container_name: issue-tracker-migration-prod

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IssueTrackerDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"

    depends_on:
      sqlserver:
        condition: service_healthy

  # API SERVICE
  api:
    image: ghcr.io/imseanstaana10/issue-tracker-api:main

    container_name: issue-tracker-api-prod

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IssueTrackerDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"

    ports:
      - "9090:8080"

    depends_on:
      migration:
        condition: service_completed_successfully

# DOCKER VOLUMES
volumes:
  sqlserver_data_prod:
    external: true
    name: issuetracker_sqlserver_data_prod

name: issuetracker-dev

services:

  # SQL SERVER SERVICE
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: issue-tracker-sqlserver-dev

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # MIGRATION SERVICE
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration

    container_name: issue-tracker-migration-dev

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IssueTrackerDb_Dev;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"

    depends_on:
      sqlserver:
        condition: service_healthy

   # API SERVICE
  api:
    image: ghcr.io/imseanstaana10/issue-tracker-api:develop
    container_name: issue-tracker-api-dev

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IssueTrackerDb_Dev;User Id=sa;Password=${SQL_PASSWORD}"

    ports:
      - "8080:8080"

    depends_on:
      migration:
        condition: service_completed_successfully

# DOCKER VOLUMES
volumes:
  sqlserver_data:
# Name ng GitHub Workflow
name: IssueTracker Backend CI

# Kailan tatakbo yung workflow?
# Tatakbo kapag may git push sa Develop/main
# o may Pull Request papunta sa Develop/main.
on:
  push:
    branches:
      - Develop
      - main

  pull_request:
    branches:
      - Develop
      - main

# Dito natin nilalagay yung mga trabaho na gagawin ni GitHub
jobs:
  # Main job: build, test, at Docker image
  build:
    # Si GitHub ang magbibigay ng Ubuntu machine
    runs-on: ubuntu-latest

    # Permissions na kailangan ng workflow
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Kunin muna ni GitHub yung code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Ihanda yung .NET environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Step 3: I-download ang NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: I-build yung backend
      - name: Build
        run: dotnet build --no-restore

      # Step 5: Patakbuhin yung automated tests
      - name: Test
        run: dotnet test --no-build

      # Step 6: Alamin kung anong Docker tag ang gagamitin
      - name: Set Docker Image Tag
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME}" = "Develop" ]; then
            echo "IMAGE_TAG=develop" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=main" >> "$GITHUB_ENV"
          fi

      # Step 7: I-build yung Docker image
      - name: Build Docker Image
        if: github.event_name == 'push'
        run: docker build -t issue-tracker-api ./IssueTracker

      # Step 8: Login sa GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 9: Bigyan ng tamang GHCR tag
      - name: Tag Docker Image
        if: github.event_name == 'push'
        run: docker tag issue-tracker-api ghcr.io/imseanstaana10/issue-tracker-api:$IMAGE_TAG

      # Step 10: Push Docker Image sa GHCR
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push ghcr.io/imseanstaana10/issue-tracker-api:$IMAGE_TAG

  # Deploy job para sa DEV environment
  deploy-dev:
    # Gagamitin yung sariling Windows PC natin
    # na naka-register bilang GitHub self-hosted runner
    runs-on: self-hosted

    # Hintayin muna na successful ang build job
    needs: build

    # DEV deployment lamang kapag push sa Develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/Develop'

    # Securely kunin ang SQL password mula sa GitHub Secret
    env:
      SQL_PASSWORD: ${{ secrets.DEV_SQL_PASSWORD }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}

    steps:
      # Step 1: Kunin yung repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Patakbuhin ang deployment script
      - name: Deploy to DEV
        shell: bash
        run: ./deploy-dev.sh

  # Deploy job para sa PROD environment
  deploy-prod:
    # Gagamitin yung sariling Windows PC natin
    # na naka-register bilang GitHub self-hosted runner
    runs-on: self-hosted

    # Hintayin muna na successful ang build job
    needs: build

    # PROD deployment lamang kapag push sa main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Securely kunin ang SQL password mula sa GitHub Secret
    env:
      SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}

    steps:
      # Step 1: Kunin yung repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Patakbuhin ang deployment script
      - name: Deploy to PROD
        shell: bash
        run: ./deploy-prod.sh
